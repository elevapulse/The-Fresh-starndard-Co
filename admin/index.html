<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Dashboard | The Fresh Standard Co.</title>

<style>
:root{
  --green:#17352b;
  --green-2:#23493b;
  --sage:#718679;
  --cream:#f4f1e9;
  --paper:#fffdf8;
  --ink:#1c2823;
  --muted:#69756f;
  --line:#dce2dc;
  --red:#8f3d3d;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
}

body{
  background:var(--cream);
  color:var(--ink);
  font-family:Inter,Arial,sans-serif;
}

.hidden{
  display:none!important;
}

button,input{
  font:inherit;
}

button{
  transition:.18s ease;
}

button:hover:not(:disabled){
  transform:translateY(-1px);
}

button:disabled{
  cursor:not-allowed;
  opacity:.62;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
}

.login-card{
  width:min(470px,100%);
  padding:48px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:0 25px 80px rgba(23,53,43,.10);
}

.brand{
  margin-bottom:38px;
}

.brand-main{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:28px;
  letter-spacing:3px;
}

.brand-sub{
  color:var(--sage);
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.login-card h1{
  margin:0 0 12px;
  font-family:Georgia,serif;
  font-size:40px;
  font-weight:400;
  color:var(--green);
}

.login-description{
  margin-bottom:28px;
  color:var(--muted);
  line-height:1.6;
}

.login-card input{
  width:100%;
  padding:16px 18px;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
  background:white;
  color:var(--ink);
}

.login-card input:focus{
  border-color:var(--sage);
  box-shadow:0 0 0 3px rgba(113,134,121,.12);
}

.primary{
  border:0;
  border-radius:999px;
  background:var(--green);
  color:white;
  font-weight:700;
  cursor:pointer;
}

.login-button{
  width:100%;
  margin-top:14px;
  padding:15px 20px;
}

.login-error{
  margin-top:14px;
  color:var(--red);
  font-size:13px;
  font-weight:600;
}

header{
  background:var(--green);
  color:white;
  padding:24px 34px;
}

.header-inner{
  width:min(1240px,100%);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.header-brand{
  font-family:Georgia,serif;
  font-size:21px;
  letter-spacing:2px;
}

.header-label{
  margin-top:4px;
  color:#c8d3cc;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.logout{
  border:1px solid rgba(255,255,255,.25);
  border-radius:999px;
  padding:10px 17px;
  background:transparent;
  color:white;
  cursor:pointer;
}

main{
  width:min(1240px,calc(100% - 40px));
  margin:0 auto;
  padding:50px 0 80px;
}

.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  margin-bottom:30px;
}

.top h1{
  margin:0;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:46px;
  font-weight:400;
}

.top p{
  margin:8px 0 0;
  color:var(--muted);
}

.refresh{
  padding:12px 20px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--paper);
  color:var(--green);
  font-weight:700;
  cursor:pointer;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}

.stat{
  padding:20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.stat-value{
  margin-top:6px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:34px;
}

.dashboard-tabs{
  display:flex;
  gap:10px;
  margin-bottom:24px;
  padding:6px;
  width:max-content;
  max-width:100%;
  background:#e9ece6;
  border:1px solid var(--line);
  border-radius:999px;
}

.dashboard-tab{
  border:0;
  border-radius:999px;
  padding:11px 18px;
  background:transparent;
  color:var(--muted);
  font-weight:800;
  cursor:pointer;
}

.dashboard-tab.active{
  background:var(--green);
  color:white;
  box-shadow:0 6px 18px rgba(23,53,43,.16);
}

.schedule-board{
  display:grid;
  gap:24px;
}

.schedule-section{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 14px 45px rgba(23,53,43,.05);
}

.schedule-section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:20px 24px;
  border-bottom:1px solid var(--line);
  background:#faf9f4;
}

.schedule-section-title{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:24px;
}

.schedule-count{
  min-width:34px;
  height:34px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:#e5ece6;
  color:var(--green);
  font-weight:800;
  font-size:12px;
}

.schedule-list{
  display:grid;
}

.schedule-job{
  display:grid;
  grid-template-columns:minmax(190px,.9fr) minmax(220px,1.2fr) minmax(150px,.75fr) minmax(190px,.85fr);
  gap:18px;
  align-items:center;
  padding:20px 24px;
  border-bottom:1px solid var(--line);
}

.schedule-job:last-child{
  border-bottom:0;
}

.schedule-date{
  color:var(--green);
  font-weight:800;
  line-height:1.45;
}

.schedule-customer{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:21px;
}

.schedule-meta{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.schedule-price{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:24px;
}

.schedule-actions{
  display:grid;
  gap:8px;
}

.schedule-actions button{
  width:100%;
  border:0;
  border-radius:999px;
  padding:10px 13px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.schedule-actions .action-main{
  background:var(--green);
  color:white;
}

.schedule-actions .action-soft{
  background:#e8eee9;
  color:var(--green);
}

.schedule-actions .action-danger{
  background:#f3e8e8;
  color:var(--red);
}

.schedule-empty{
  padding:28px 24px;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

.dashboard-tools{
  display:grid;
  grid-template-columns:minmax(240px,1fr) 210px auto;
  gap:12px;
  margin:0 0 20px;
}

.dashboard-tools input,
.dashboard-tools select{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  background:#fff;
  color:var(--green);
  font:inherit;
  outline:none;
}

.dashboard-tools input:focus,
.dashboard-tools select:focus{
  border-color:var(--sage);
  box-shadow:0 0 0 3px rgba(130,147,129,.12);
}

.clear-filters{
  border:1px solid var(--line);
  border-radius:999px;
  padding:11px 17px;
  background:var(--paper);
  color:var(--green);
  font-weight:800;
  cursor:pointer;
}

.filter-summary{
  margin:-8px 0 18px;
  color:var(--muted);
  font-size:12px;
}

.quotes{
  display:grid;
  gap:20px;
}

.quote-card{
  padding:28px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 14px 45px rgba(23,53,43,.05);
}

.quote-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}

.quote-number{
  color:var(--sage);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.customer-name{
  margin-top:5px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:29px;
}

.status{
  height:max-content;
  padding:7px 11px;
  border-radius:999px;
  background:#e8eee9;
  color:var(--green);
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}

.status.new{
  background:#ecebe5;
}

.status.quoted{
  background:#e7eee8;
}

.status.accepted,
.status.card_saved,
.status.booked{
  background:#e5eee7;
}

.status.completed{
  background:#e8eee6;
}

.status.charged{
  background:#dce9df;
}

.status.cancelled{
  background:#f2e5e5;
  color:var(--red);
}

.quote-grid{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);
  gap:28px;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.detail{
  padding:14px 15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}

.detail-label{
  margin-bottom:5px;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

.detail-value{
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  word-break:break-word;
}

.notes{
  grid-column:1/-1;
}

.pricing{
  border-left:1px solid var(--line);
  padding-left:28px;
}

.pricing h3{
  margin:0 0 14px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:24px;
  font-weight:400;
}

.price-wrap{
  position:relative;
  margin-bottom:11px;
}

.dollar{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-weight:700;
}

.price-input{
  width:100%;
  padding:14px 14px 14px 31px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
  background:white;
}

.price-input:focus{
  border-color:var(--sage);
  box-shadow:0 0 0 3px rgba(113,134,121,.12);
}

.create-offer,
.copy,
.complete-button,
.reschedule-button,
.cancel-button,
.charge-button,
.locked-button{
  width:100%;
  border:0;
  border-radius:999px;
  padding:13px 16px;
  font-weight:700;
}

.create-offer,
.complete-button,
.charge-button{
  background:var(--green);
  color:white;
  cursor:pointer;
}

.copy{
  margin-top:10px;
  background:#e8eee9;
  color:var(--green);
  cursor:pointer;
}

.reschedule-button{
  margin-top:9px;
  background:#e8eee9;
  color:var(--green);
  cursor:pointer;
}

.cancel-button{
  margin-top:9px;
  background:#f3e8e8;
  color:var(--red);
  cursor:pointer;
}

.locked-button{
  background:#ecebe5;
  color:var(--muted);
}

.locked-note,
.existing-offer{
  margin-top:9px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.offer-result{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
}

.offer-price{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:28px;
}

.booking-action,
.completed-box,
.cancelled-box{
  margin-top:18px;
  padding:17px;
  border-radius:16px;
  background:#eef2ed;
}

.cancelled-box{
  background:#f4eaea;
}

.booking-action-title,
.completed-title,
.cancelled-title{
  color:var(--green);
  font-weight:800;
}

.cancelled-title{
  color:var(--red);
}

.booking-action-text,
.completed-text,
.cancelled-text{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.schedule-display{
  margin-top:14px;
  padding:13px;
  border-radius:12px;
  background:rgba(255,255,255,.72);
}

.schedule-label,
.amount-label{
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

.schedule-value{
  margin-top:5px;
  color:var(--green);
  font-weight:700;
  line-height:1.45;
}

.complete-button{
  margin-top:13px;
}

.amount-due{
  margin-top:14px;
  padding:13px;
  border-radius:12px;
  background:rgba(255,255,255,.72);
}

.amount-value{
  margin-top:4px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:28px;
}

.charge-button{
  margin-top:13px;
}

.payment-id{
  margin-top:10px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  word-break:break-all;
}

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(12,30,24,.52);
  backdrop-filter:blur(8px);
}

.modal-card{
  width:100%;
  max-width:470px;
  background:var(--paper);
  border-radius:26px;
  padding:34px;
  box-shadow:0 28px 80px rgba(10,30,23,.28);
  border:1px solid rgba(23,53,43,.08);
  text-align:center;
}

.modal-icon{
  width:58px;
  height:58px;
  margin:0 auto 20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e7eee8;
  color:var(--green);
  font-size:27px;
  font-weight:700;
}

.modal-icon.error{
  background:#f5e8e8;
  color:var(--red);
}

.modal-icon.warning{
  background:#f3eee1;
  color:#755f2e;
}

.modal-eyebrow{
  color:var(--sage);
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.modal-title{
  margin:0;
  font-family:Georgia,serif;
  font-size:31px;
  font-weight:400;
}

.modal-message{
  margin:13px auto 0;
  max-width:390px;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}

.modal-amount{
  margin:24px 0 0;
  padding:18px;
  border-radius:16px;
  background:#eef2ed;
}

.modal-amount-label{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.modal-amount-value{
  margin-top:4px;
  font-family:Georgia,serif;
  font-size:35px;
}

.modal-reference{
  margin-top:17px;
  padding:14px;
  background:#f4f2ec;
  border-radius:13px;
  text-align:left;
}

.modal-reference-label{
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.modal-reference-value{
  font-size:12px;
  line-height:1.5;
  word-break:break-all;
}

.modal-form{
  margin-top:22px;
  text-align:left;
}

.modal-field{
  margin-top:14px;
}

.modal-field:first-child{
  margin-top:0;
}

.modal-field label{
  display:block;
  margin-bottom:7px;
  color:var(--green);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.1px;
  text-transform:uppercase;
}

.modal-field input{
  width:100%;
  border:1px solid #d8ddd7;
  background:#fff;
  color:var(--ink);
  border-radius:13px;
  padding:13px 14px;
  font:inherit;
  outline:none;
}

.modal-field input:focus{
  border-color:var(--sage);
  box-shadow:0 0 0 3px rgba(105,126,112,.12);
}

.modal-field-error{
  min-height:18px;
  margin-top:8px;
  color:var(--red);
  font-size:12px;
  font-weight:600;
}

.modal-card.schedule-modal{
  max-width:520px;
  text-align:left;
}

.modal-card.schedule-modal .modal-icon{
  margin-left:0;
}

.modal-card.schedule-modal .modal-message{
  margin-left:0;
}

.modal-card.schedule-modal .modal-actions{
  margin-top:18px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.modal-button{
  flex:1;
  border:0;
  padding:14px 17px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}

.modal-button.secondary{
  background:#eceae3;
  color:var(--green);
}

.modal-button.primary-modal{
  background:var(--green);
  color:white;
}

.modal-button.danger{
  background:var(--red);
  color:white;
}

.empty,
.loading{
  background:var(--paper);
  border-radius:20px;
  padding:45px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:850px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .quote-grid{
    grid-template-columns:1fr;
  }

  .schedule-job{
    grid-template-columns:1fr 1fr;
  }

  .pricing{
    border-left:0;
    border-top:1px solid var(--line);
    padding-left:0;
    padding-top:25px;
  }
}

@media(max-width:760px){
  .dashboard-tools{
    grid-template-columns:1fr;
  }

  .clear-filters{
    width:100%;
  }
}

@media(max-width:550px){
  .login-card{
    padding:35px 22px;
  }

  header{
    padding:20px;
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .top h1{
    font-size:34px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .quote-head{
    flex-direction:column;
  }

  .details{
    grid-template-columns:1fr;
  }

  .notes{
    grid-column:auto;
  }

  .quote-card{
    padding:20px;
  }

  .dashboard-tabs{
    width:100%;
  }

  .dashboard-tab{
    flex:1;
    padding:11px 12px;
  }

  .schedule-job{
    grid-template-columns:1fr;
  }

  .schedule-section-head,
  .schedule-job{
    padding-left:18px;
    padding-right:18px;
  }

  .modal-card{
    padding:28px 20px;
  }

  .modal-actions{
    flex-direction:column-reverse;
  }
}
</style>
</head>

<body>

<section id="loginPage" class="login-page">
  <div class="login-card">

    <div class="brand">
      <div class="brand-main">
        THE FRESH
      </div>

      <div class="brand-sub">
        Standard Co.
      </div>
    </div>

    <h1>
      Owner Dashboard
    </h1>

    <div class="login-description">
      Sign in to review incoming cleaning requests and create customer offers.
    </div>

    <input
      id="password"
      type="password"
      placeholder="Admin password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      class="primary login-button"
    >
      Sign In
    </button>

    <div
      id="loginError"
      class="login-error hidden"
    ></div>

  </div>
</section>


<section id="dashboard" class="hidden">

<header>

  <div class="header-inner">

    <div>

      <div class="header-brand">
        THE FRESH STANDARD CO.
      </div>

      <div class="header-label">
        Owner Dashboard
      </div>

    </div>

    <button
      id="logoutButton"
      class="logout"
    >
      Sign Out
    </button>

  </div>

</header>


<main>

  <div class="top">

    <div>

      <h1>
        Quote Requests
      </h1>

      <p>
        Review leads, set pricing and create customer booking offers.
      </p>

    </div>

    <button
      id="refreshButton"
      class="refresh"
    >
      Refresh
    </button>

  </div>


  <div class="stats">

    <div class="stat">
      <div class="stat-label">
        Total
      </div>

      <div
        id="totalCount"
        class="stat-value"
      >
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-label">
        New
      </div>

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


function money(cents){

  const value =
    Number(cents);

  if(!Number.isFinite(value)){
    return "$0.00";
  }

  return (
    value / 100
  ).toLocaleString(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  );
}


function formatSchedule(value){

  if(!value){
    return "Not scheduled";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "Not scheduled";
  }

  return date.toLocaleString(
    "en-US",
    {
      weekday:"short",
      month:"short",
      day:"numeric",
      year:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );
}


function offerUrl(q){

  if(!q.quote_token){
    return "";
  }

  return (
    `${window.location.origin}` +
    `/quote/?token=` +
    encodeURIComponent(
      q.quote_token
    )
  );
}


function paymentUrl(q){

  if(!q.quote_token){
    return "";
  }

  return (
    `${window.location.origin}` +
    `/payment/?token=` +
    encodeURIComponent(
      q.quote_token
    )
  );
}

  const oldForm =
    modalOverlay.querySelector(
      ".modal-form"

  if(oldForm){
    oldForm.remove();
  }

  if(modalResolver){

    const resolver =
      modalResolver;

    modalResolver = null;

    resolver(result);
  }
}


function prepareModal({
  type="success",

  title="",
  message="",
  amount="",
  referenceLabel="",

    );

    oldForm.remove();
  }

    modalOverlay.querySelector(
      ".modal-card"

  card?.classList.remove(
    "schedule-modal"
  );

  modalIcon.className =
    "modal-icon";

  if(type==="error"){

    modalIcon.classList.add(
      "error"

    modalIcon.textContent="×";

  }

  else if(type==="warning"){

    modalIcon.classList.add(
      "warning"
    );

    modalIcon.textContent="!";

  }

  else if(type==="confirm"){

    modalIcon.classList.add(
      "warning"
    );

    modalIcon.textContent="?";

  }

  else{

    modalIcon.textContent="✓";

  }


  modalEyebrow.textContent =

  modalTitle.textContent =
    title;


  modalMessage.textContent =
    message;

    modalAmount.classList.remove(
      "hidden"

  }else{

    modalAmountValue.textContent="";

    modalAmount.classList.add(

    modalReferenceValue.textContent="";

function showScheduleModal(){

  return new Promise(resolve=>{

    modalResolver=null;


    prepareModal({
      type:"confirm",
      eyebrow:"Booking schedule",
      title:"Choose a new schedule",
      message:
        "Select the new cleaning date and time. " +
        "The quote price and saved payment method will not change."
    });


    const card =
      modalOverlay.querySelector(
        ".modal-card"
      );


    card.classList.add(
      "schedule-modal"
    );


    const form =
      document.createElement(
        "div"
      );


    form.className =
      "modal-form";


    const now =
      new Date();


    const year =
      now.getFullYear();


    const month =
      String(
        now.getMonth()+1
      ).padStart(2,"0");


    const day =
      String(
        now.getDate()
      ).padStart(2,"0");


    const minDate =
      `${year}-${month}-${day}`;


    form.innerHTML=`
      <div class="modal-field">

        <label for="scheduleDate">
          Cleaning date
        </label>

        <input
          id="scheduleDate"
          type="date"
          min="${minDate}"
          autocomplete="off"
        >

      </div>


      <div class="modal-field">

        <label for="scheduleTime">
          Cleaning time
        </label>

        <input
          id="scheduleTime"
          type="time"
          step="900"
          autocomplete="off"
        >

      </div>


      <div
        id="scheduleError"
        class="modal-field-error"
        aria-live="polite"
      ></div>
    `;


    modalActions.parentNode
      .insertBefore(
        form,
        modalActions
      );


    const finish=value=>{

      form.remove();


      card.classList.remove(
        "schedule-modal"
      );


      modalOverlay.classList.add(
        "hidden"
      );


      document.body.style.overflow =
        "";


      resolve(value);

    };


    const cancel =
      document.createElement(
        "button"
      );


    cancel.className =
      "modal-button secondary";


    cancel.textContent =
      "Keep Current Schedule";


    cancel.addEventListener(
      "click",
      ()=>finish(null)
    );


    const confirm =
      document.createElement(
        "button"
      );


    confirm.className =
      "modal-button primary-modal";


    confirm.textContent =
      "Continue";


    confirm.addEventListener(
      "click",
      ()=>{

        const date =
          form.querySelector(
            "#scheduleDate"
          ).value;


        const time =
          form.querySelector(
            "#scheduleTime"
          ).value;


        const error =
          form.querySelector(
            "#scheduleError"
          );


        error.textContent="";


        if(
          !date ||
          !time
        ){

          error.textContent =
            "Choose both a date and time.";

          return;

        }


        const scheduledDate =
          new Date(
            `${date}T${time}:00`
          );


        if(
          Number.isNaN(
            scheduledDate.getTime()
          )
        ){

          error.textContent =
            "Choose a valid date and time.";

          return;

        }


        if(
          scheduledDate.getTime() <=
          Date.now()
        ){

          error.textContent =
            "The cleaning must be scheduled for a future date and time.";

          return;

        }


        finish(
          scheduledDate
        );

      }
    );


    modalActions.append(
      cancel,
      confirm
    );


    setTimeout(
      ()=>{

        form.querySelector(
          "#scheduleDate"
        )?.focus();

      },
      0
    );

  });
}


function matchesSearch(q){

  const term =
    dashboardSearch.value
      .trim()
      .toLowerCase();


  if(!term){
    return true;
  }


  return [
    q.customer_name,
    q.customer_phone,
    q.customer_email,
    q.quote_number,
    q.zip_code
  ]
    .filter(Boolean)
    .some(value=>
      String(value)
        .toLowerCase()
        .includes(term)
    );
}


function matchesStatus(q){

  const value =
    statusFilter.value;


  if(value === "all"){
    return true;
  }


  if(value === "booked"){

    return [
      "accepted",
      "card_saved",
      "booked"
    ].includes(q.status);

  }


  return q.status === value;
}


function startOfToday(){

  const d =
    new Date();

  d.setHours(
    0,
    0,
    0,
    0
  );

  return d;
}


function endOfToday(){

  const d =
    new Date();

  d.setHours(
    23,
    59,
    59,
    999
  );

  return d;
}


function endOfWeek(){

  const d =
    endOfToday();

  const day =
    d.getDay();

  const daysUntilSunday =
    7 - day;

  d.setDate(
    d.getDate() +
    daysUntilSunday
  );

  return d;
}


function matchesScheduleFilter(q){

  const value =
    scheduleFilter.value;


  if(value === "all"){
    return true;
  }


  const active = [
    "accepted",
    "card_saved",
    "booked"
  ].includes(q.status);


  if(value === "needs-scheduling"){

    return (
      active &&
      !q.scheduled_for
    );

  }


  if(value === "completed"){

    return (
      q.status ===
      "completed"
    );

  }


  if(value === "paid"){

    return (
      q.status ===
      "charged"
    );

  }


  if(
    !active ||
    !q.scheduled_for
  ){
    return false;
  }


  const date =
    new Date(
      q.scheduled_for
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return false;
  }


  if(value === "today"){

    return (
      date >= startOfToday() &&
      date <= endOfToday()
    );

  }


  if(value === "week"){

    return (
      date >= startOfToday() &&
      date <= endOfWeek()
    );

  }


  if(value === "upcoming"){

    return (
      date >= new Date()
    );

  }


  return true;
}


function filteredQuotes(){

  return allQuotes.filter(
    q=>
      matchesSearch(q) &&
      matchesStatus(q)
  );
}


function filteredScheduleQuotes(){

  return allQuotes.filter(
    q=>
      matchesSearch(q) &&
      matchesScheduleFilter(q)
  );
}

  if(

    const items =

    renderSchedule(

    updateFilterSummary(
      items.length,
      allQuotes.length

  const items =

  renderQuotes(
    items

  updateFilterSummary(
    items.length,
    allQuotes.length

}

function scheduleJobHtml(
  q,
  type
){

  const scheduleText =
    q.scheduled_for
      ? formatSchedule(
          q.scheduled_for
        )
      : "Needs a cleaning date and time";


  const phone =
    q.customer_phone ||
    "No phone";


  const service =
    q.service_type ||
    "Cleaning service";


  let actions = "";


  if(type === "upcoming"){

    actions = `
      <button
        class="action-main"
        id="complete-${q.id}"
        onclick="markCleaningComplete('${q.id}')"
      >
        Mark Complete
      </button>

      <button
        class="action-soft"
        id="reschedule-${q.id}"
        onclick="rescheduleBooking('${q.id}')"
      >
        Reschedule
      </button>

      <button
        class="action-danger"
        id="cancel-${q.id}"
        onclick="cancelBooking('${q.id}')"
      >
        Cancel
      </button>
    `;

  }


  else if(
    type ===
    "needs-scheduling"
  ){

    actions = `
      <button
        class="action-main"
        id="reschedule-${q.id}"
        onclick="rescheduleBooking('${q.id}')"
      >
        Schedule Cleaning
      </button>

      <button
        class="action-danger"
        id="cancel-${q.id}"
        onclick="cancelBooking('${q.id}')"
      >
        Cancel
      </button>
    `;

  }  else if(type === "completed"){

    actions = `
      <button
        class="action-main"
        id="charge-${q.id}"
        onclick="chargeCustomer(
          '${q.id}',
          ${Number(q.quoted_price)||0},
          '${paymentUrl(q)}'
        )"
      >
        Charge ${money(q.quoted_price)}
      </button>
    `;

  }


  else if(type === "paid"){

    actions = `
      <button
        class="locked-button"
        type="button"
        disabled
      >
        Paid ✓
      </button>
    `;

  }


  return `
    <div class="schedule-job">

      <div>
        <div class="schedule-date">
          ${escapeHtml(scheduleText)}
        </div>

        <div class="schedule-meta">
          ${escapeHtml(q.quote_number || "Quote")}
        </div>
      </div>


      <div>
        <div class="schedule-customer">
          ${escapeHtml(q.customer_name || "Customer")}
        </div>

        <div class="schedule-meta">
          ${escapeHtml(service)} · ${escapeHtml(phone)}
        </div>
      </div>


      <div>
        <div class="schedule-price">
          ${money(q.quoted_price)}
        </div>

        <div class="schedule-meta">
          ${escapeHtml(
            (q.status || "").replaceAll("_"," ")
          )}
        </div>
      </div>


      <div class="schedule-actions">
        ${actions}
      </div>

    </div>
  `;
}


function scheduleSectionHtml(
  title,
  items,
  type,
  emptyText
){

  return `
    <section class="schedule-section">

      <div class="schedule-section-head">

        <div class="schedule-section-title">

        <div class="schedule-count">

        }

    </section>
  `;
}


function renderSchedule(quotes){

  const activeStatuses = [
    "accepted",
    "card_saved",
    "booked"
  ];


  const upcoming =
    quotes
      .filter(
        q=>
          activeStatuses.includes(q.status) &&
          q.scheduled_for
      )
      .sort(
        (a,b)=>
          new Date(a.scheduled_for) -
          new Date(b.scheduled_for)
      );


  const needsScheduling =
    quotes.filter(
      q=>
        activeStatuses.includes(q.status) &&
        !q.scheduled_for
    );


  const completed =
    quotes
      .filter(
        q=>q.status === "completed"
      )
      .sort(
        (a,b)=>
          new Date(
            b.completed_at ||
            b.created_at
          ) -
          new Date(
            a.completed_at ||
            a.created_at
          )
      );


  const paid =
    quotes
      .filter(
        q=>q.status === "charged"
      )
      .sort(
        (a,b)=>
          new Date(
            b.charged_at ||
            b.created_at
          ) -
          new Date(
            a.charged_at ||
            a.created_at
          )
      );


  scheduleBoard.innerHTML =
    scheduleSectionHtml(
      "Upcoming Cleanings",
      upcoming,
      "upcoming",

    ) +

    scheduleSectionHtml(
      "Needs Scheduling",
      needsScheduling,
      "needs-scheduling",

    ) +

    scheduleSectionHtml(
      "Completed · Awaiting Payment",
      completed,
      "completed",
      "No completed cleanings are waiting for payment."
    ) +

    scheduleSectionHtml(
      "Paid Jobs",
      paid,
      "paid",
      "No paid jobs yet."
    );
}


function setStats(quotes){

  document
    .getElementById(
      "totalCount"
    )
    .textContent =
      quotes.length;


  document
    .getElementById(
      "newCount"
    )
    .textContent =
      quotes.filter(
        q=>q.status==="new"
      ).length;


  document
    .getElementById(
      "quotedCount"
    )
    .textContent =
      quotes.filter(
        q=>q.status==="quoted"
      ).length;


  document
    .getElementById(
      "bookedCount"
    )
    .textContent =
      quotes.filter(
        q=>
          [
            "accepted",
            "card_saved",
            "booked",
            "completed",
            "charged"
          ].includes(
            q.status
          )
      ).length;
}

              q.square_feet

async function loadQuotes(){

  if(!adminPassword){
    return;
  }


  refreshButton.disabled=true;

  refreshButton.textContent=
    "Refreshing...";


  try{

    const response =
      await fetch(
        "/.netlify/functions/admin-quotes",
        {
          method:"GET",

          headers:{
            "x-admin-password":
              adminPassword
          },

          cache:"no-store"
        }
      );


    const data =
      await response
        .json()
        .catch(()=>null);


    if(
      !response.ok ||
      !data ||
      !data.ok
    ){

      if(
        response.status===401
      ){

        throw new Error(
          "Incorrect admin password."
        );

      }


      throw new Error(
        data?.error ||
        "Could not load quotes."
      );

    }


    allQuotes =
      Array.isArray(
        data.quotes
      )
        ? data.quotes
        : [];


    setStats(allQuotes);


    setDashboardView(
      currentView
    );


  }catch(error){

    quotesContainer.innerHTML=`
      <div class="empty">
        ${escapeHtml(
          error.message ||
          "Could not load quotes."
        )}
      </div>
    `;


    throw error;


  }finally{

    refreshButton.disabled=false;

    refreshButton.textContent=
      "Refresh";

  }
}


async function login(){

  const password =
    passwordInput.value.trim();


  loginError.classList.add(
    "hidden"
  );

  loginError.textContent="";


  if(!password){

    loginError.textContent=
      "Enter the admin password.";

    loginError.classList.remove(
      "hidden"
    );

    return;
  }


  loginButton.disabled=true;

  loginButton.textContent=
    "Signing In...";


  adminPassword=password;


  try{

    await loadQuotes();


    loginPage.classList.add(
      "hidden"
    );


    dashboard.classList.remove(
      "hidden"
    );


    passwordInput.value="";


  }catch(error){

    adminPassword="";


    loginError.textContent=
      error.message ||
      "Could not sign in.";


    loginError.classList.remove(
      "hidden"
    );


  }finally{

    loginButton.disabled=false;

    loginButton.textContent=
      "Sign In";

  }
}


function logout(){

  adminPassword="";


  quotesContainer.innerHTML=`
    <div class="loading">
      Loading quotes...
    </div>
  `;


  dashboard.classList.add(
    "hidden"
  );


  loginPage.classList.remove(
    "hidden"
  );


  passwordInput.value="";


  passwordInput.focus();
}


async function createOffer(
  quoteId
){

  const input =
    document.getElementById(
      `price-${quoteId}`
    );


  const button =
    document.getElementById(
      `offer-${quoteId}`
    );


  const result =
    document.getElementById(
      `result-${quoteId}`
    );


  if(
    !input ||
    !button ||
    !result
  ){
    return;
  }


  const dollars =
    Number(
      input.value
    );


  if(
    !Number.isFinite(
      dollars
    ) ||
    dollars<=0
  ){

    await showMessageModal({
      type:"error",
      eyebrow:"Quote price",
      title:"Enter a valid price",
      message:
        "Enter a valid cleaning price before creating the customer offer."
    });


    input.focus();

    return;
  }


  const amount =
    Math.round(
      dollars*100
    );


  button.disabled=true;

  button.textContent=
    "Creating Offer...";


  try{

    const response =
      await fetch(
        "/.netlify/functions/create-offer",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-admin-password":
              adminPassword
          },

          body:
            JSON.stringify({
              quote_id:quoteId,
              amount
            })
        }
      );


    const data =
      await response
        .json()
        .catch(()=>null);


    if(
      !response.ok ||
      !data ||
      !data.ok
    ){

      throw new Error(
        data?.error ||
        "Could not create offer."
      );

    }


    result.className=
      "offer-result";


    result.innerHTML=`
      <div class="offer-price">
        ${money(
          data.quoted_price
        )}
      </div>

      <button
        class="copy"
        id="copy-${quoteId}"
      >
        Copy Customer Link
      </button>

      <div class="existing-offer">
        Offer created successfully.
      </div>
    `;


    document
      .getElementById(
        `copy-${quoteId}`
      )
      .addEventListener(
        "click",
        ()=>{
          copyOffer(
            quoteId,
            data.offer_url
          );
        }
      );


    button.textContent=
      "Update Customer Offer";


  }catch(error){

    await showMessageModal({
      type:"error",
      eyebrow:"Offer error",
      title:"Could not create offer",
      message:
        error.message ||
        "Could not create offer."
    });


  }finally{

    button.disabled=false;


    if(
      button.textContent===
      "Creating Offer..."
    ){

      button.textContent=
        "Create Customer Offer";

    }
  }
}


async function copyOffer(
  quoteId,
  url
){

  try{

    await navigator
      .clipboard
      .writeText(url);


    const button =
      document.getElementById(
        `copy-${quoteId}`
      );


    if(button){

      const original =
        button.textContent;


      button.textContent=
        "Copied ✓";


      setTimeout(
        ()=>{
          button.textContent=
            original;
        },
        1500
      );

    }


  }catch{

    await showMessageModal({
      type:"warning",
      eyebrow:"Customer link",
      title:"Copy this link",
      message:url,
      buttonText:"Done"
    });

  }
}

  recoveryLink
){

  const button =
    document.getElementById(
      `charge-${quoteId}`
    );


  if(!button){
    return;
  }


  const formattedAmount =
    money(
      displayedAmount
    );


  const confirmed =
    await showConfirmModal({
      eyebrow:
        "Payment authorization",

      title:
        "Charge customer?",

      message:
        "The cleaning is marked complete. " +
        "This will charge the customer's saved payment method.",

      amount:
        formattedAmount,

      confirmText:
        `Charge ${formattedAmount}`,

      cancelText:
        "Cancel"
    });


  if(!confirmed){
    return;
  }


  const originalText =
    button.textContent;


  button.disabled=true;

  button.textContent=
    "Processing Payment...";


  try{

    const response =
      await fetch(
        "/.netlify/functions/charge-customer",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-admin-password":
              adminPassword
          },

          body:
            JSON.stringify({
              quote_id:
                quoteId
            })
        }
      );


    const data =
      await response
        .json()
        .catch(()=>null);


    if(
      !response.ok ||
      !data ||
      !data.ok
    ){

      /*
        Stripe charged successfully but
        database update failed.

        NEVER charge again.
      */

      if(
        data &&
        data.payment_succeeded
      ){

        await showMessageModal({
          type:"warning",
          eyebrow:
            "Payment needs review",
          title:
            "Do not charge again",
          message:
            "Stripe successfully charged the customer, " +
            "but the booking record could not be updated. " +
            "Do NOT retry this payment.",
          referenceLabel:
            "Stripe Payment ID",
          referenceValue:
            data.payment_intent_id ||
            "Unknown",
          buttonText:
            "I Understand"
        });


        button.disabled=true;

        button.textContent=
          "Payment Needs Review";


        return;
      }


      /*
        Saved payment failed.
        Show secure recovery link.
      */

      if(
        data &&
        data.customer_action_required===true &&
        recoveryLink
      ){

        prepareModal({
          type:"warning",
          eyebrow:
            "Payment failed",
          title:
            "Customer action required",
          message:
            data.customer_message ||
            "The saved payment method could not be charged. Send the customer the secure payment link so they can use another payment method.",
          amount:
            formattedAmount,
          referenceLabel:
            "Secure Payment Link",
          referenceValue:
            recoveryLink
        });


        const closeButton =
          document.createElement(
            "button"
          );


        closeButton.className =
          "modal-button secondary";


        closeButton.textContent =
          "Close";


        closeButton.addEventListener(
          "click",
          ()=>closeModal(true)
        );


        const copyButton =
          document.createElement(
            "button"
          );


        copyButton.className =
          "modal-button primary-modal";


        copyButton.textContent =
          "Copy Payment Link";


        copyButton.addEventListener(
          "click",
          async ()=>{

            try{

              await navigator
                .clipboard
                .writeText(
                  recoveryLink
                );


              copyButton.textContent =
                "Copied ✓";


              setTimeout(
                ()=>{
                  copyButton.textContent =
                    "Copy Payment Link";
                },
                1500
              );


            }catch{

              modalReferenceValue
                .textContent =
                  recoveryLink;

            }
          }
        );


        modalActions.appendChild(
          closeButton
        );


        modalActions.appendChild(
          copyButton
        );


        button.disabled=false;

        button.textContent=
          originalText;


        return;
      }


      throw new Error(
        data?.detail ||
        data?.error ||
        "The customer could not be charged."
      );

    }


    await loadQuotes();


    await showMessageModal({
      type:"success",
      eyebrow:
        "Payment completed",
      title:
        "Customer charged successfully",
      message:
        "The payment was processed successfully and this booking is now marked as paid.",
      amount:
        data.amount_formatted ||
        formattedAmount,
      referenceLabel:
        "Stripe Payment ID",
      referenceValue:
        data.payment_intent_id ||
        "",
      buttonText:
        "Done"
    });


  }catch(error){

    await showMessageModal({
      type:"error",
      eyebrow:
        "Payment error",
      title:
        "Payment could not be completed",
      message:
        error.message ||
        "The customer could not be charged."
    });


    button.disabled=false;

    button.textContent=
      originalText;

  }
}


dashboardSearch
  .addEventListener(
    "input",
    applyDashboardFilters
  );


statusFilter
  .addEventListener(
    "change",
    applyDashboardFilters
  );


scheduleFilter
  .addEventListener(
    "change",
    applyDashboardFilters
  );


clearFiltersButton
  .addEventListener(
    "click",
    ()=>{

      dashboardSearch.value = "";

      statusFilter.value = "all";

      scheduleFilter.value = "all";

      applyDashboardFilters();

    }
  );


loginButton
  .addEventListener(
    "click",
    login
  );


passwordInput
  .addEventListener(
    "keydown",
    event=>{

      if(
        event.key==="Enter"
      ){
        login();
      }

    }
  );


quotesTab
  .addEventListener(
    "click",
    ()=>setDashboardView("quotes")
  );


scheduleTab
  .addEventListener(
    "click",
    ()=>setDashboardView("schedule")
  );


refreshButton
  .addEventListener(
    "click",
    async ()=>{

      try{

        await loadQuotes();

      }catch{

        /* Error already rendered */

      }

    }
  );


document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    logout
  );

</script>

</body>
</html>
