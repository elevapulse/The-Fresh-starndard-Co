<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Dashboard | The Fresh Standard Co.</title>
<style>
:root{
  --green:#17352b;
  --green-2:#23493b;
  --sage:#718679;
  --cream:#f4f1e9;
  --paper:#fffdf8;
  --ink:#1c2823;
  --muted:#69756f;
  --line:#dce2dc;
  --red:#8f3d3d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:Inter,Arial,sans-serif;
}
.hidden{display:none!important}
button,input{font:inherit}
button{transition:.18s ease}
button:hover:not(:disabled){transform:translateY(-1px)}
button:disabled{cursor:not-allowed;opacity:.62}
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
}
.login-card{
  width:min(470px,100%);
  padding:48px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:0 25px 80px rgba(23,53,43,.10);
}
.brand{margin-bottom:38px}
.brand-main{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:28px;
  letter-spacing:3px;
}
.brand-sub{
  color:var(--sage);
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
}
.login-card h1{
  margin:0 0 12px;
  font-family:Georgia,serif;
  font-size:40px;
  font-weight:400;
  color:var(--green);
}
.login-description{
  margin-bottom:28px;
  color:var(--muted);
  line-height:1.6;
}
.login-card input{
  width:100%;
  padding:16px 18px;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
  background:white;
  color:var(--ink);
}
.login-card input:focus{
  border-color:var(--sage);
  box-shadow:0 0 0 3px rgba(113,134,121,.12);
}
.primary{
  border:0;
  border-radius:999px;
  background:var(--green);
  color:white;
  font-weight:700;
  cursor:pointer;
}
.login-button{
  width:100%;
  margin-top:14px;
  padding:15px 20px;
}
.login-error{
  margin-top:14px;
  color:var(--red);
  font-size:13px;
  font-weight:600;
}
header{
  background:var(--green);
  color:white;
  padding:24px 34px;
}
.header-inner{
  width:min(1240px,100%);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.header-brand{
  font-family:Georgia,serif;
  font-size:21px;
  letter-spacing:2px;
}
.header-label{
  margin-top:4px;
  color:#c8d3cc;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}
.logout{
  border:1px solid rgba(255,255,255,.25);
  border-radius:999px;
  padding:10px 17px;
  background:transparent;
  color:white;
  cursor:pointer;
}
main{
  width:min(1240px,calc(100% - 40px));
  margin:0 auto;
  padding:50px 0 80px;
}
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  margin-bottom:30px;
}
.top h1{
  margin:0;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:46px;
  font-weight:400;
}
.top p{
  margin:8px 0 0;
  color:var(--muted);
}
.refresh{
  padding:12px 20px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--paper);
  color:var(--green);
  font-weight:700;
  cursor:pointer;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}
.stat{
  padding:20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
}
.stat-label{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.stat-value{
  margin-top:6px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:34px;
}
.dashboard-tabs{
  display:flex;
  gap:10px;
  margin-bottom:24px;
  padding:6px;
  width:max-content;
  max-width:100%;
  background:#e9ece6;
  border:1px solid var(--line);
  border-radius:999px;
}
.dashboard-tab{
  border:0;
  border-radius:999px;
  padding:11px 18px;
  background:transparent;
  color:var(--muted);
  font-weight:800;
  cursor:pointer;
}
.dashboard-tab.active{
  background:var(--green);
  color:white;
  box-shadow:0 6px 18px rgba(23,53,43,.16);
}
.schedule-board{
  display:grid;
  gap:24px;
}
.schedule-section{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 14px 45px rgba(23,53,43,.05);
}
.schedule-section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:20px 24px;
  border-bottom:1px solid var(--line);
  background:#faf9f4;
}
.schedule-section-title{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:24px;
}
.schedule-count{
  min-width:34px;
  height:34px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:#e5ece6;
  color:var(--green);
  font-weight:800;
  font-size:12px;
}
.schedule-list{display:grid}
.schedule-job{
  display:grid;
  grid-template-columns:minmax(190px,.9fr) minmax(220px,1.2fr) minmax(150px,.75fr) minmax(190px,.85fr);
  gap:18px;
  align-items:center;
  padding:20px 24px;
  border-bottom:1px solid var(--line);
}
.schedule-job:last-child{border-bottom:0}
.schedule-date{
  color:var(--green);
  font-weight:800;
  line-height:1.45;
}
.schedule-customer{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:21px;
}
.schedule-meta{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
.schedule-price{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:24px;
}
.schedule-actions{
  display:grid;
  gap:8px;
}
.schedule-actions button{
  width:100%;
  border:0;
  border-radius:999px;
  padding:10px 13px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.schedule-actions .action-main{background:var(--green);color:white}
.schedule-actions .action-soft{background:#e8eee9;color:var(--green)}
.schedule-actions .action-danger{background:#f3e8e8;color:var(--red)}
.schedule-empty{
  padding:28px 24px;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}
.dashboard-tools{
  display:grid;
  grid-template-columns:minmax(240px,1fr) 210px 210px auto;
  gap:12px;
  margin:0 0 20px;
}
.dashboard-tools input,
.dashboard-tools select{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  background:#fff;
  color:var(--green);
  font:inherit;
  outline:none;
}
.dashboard-tools input:focus,
.dashboard-tools select:focus{
  border-color:var(--sage);
  box-shadow:0 0 0 3px rgba(130,147,129,.12);
}
.clear-filters{
  border:1px solid var(--line);
  border-radius:999px;
  padding:11px 17px;
  background:var(--paper);
  color:var(--green);
  font-weight:800;
  cursor:pointer;
}
.filter-summary{
  margin:-8px 0 18px;
  color:var(--muted);
  font-size:12px;
}
.quotes{
  display:grid;
  gap:20px;
}
.quote-card{
  padding:28px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 14px 45px rgba(23,53,43,.05);
}
.quote-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}
.quote-number{
  color:var(--sage);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.customer-name{
  margin-top:5px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:29px;
}
.status{
  height:max-content;
  padding:7px 11px;
  border-radius:999px;
  background:#e8eee9;
  color:var(--green);
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}
.status.new{background:#ecebe5}
.status.quoted{background:#e7eee8}
.status.accepted,
.status.card_saved,
.status.booked{background:#e5eee7}
.status.completed{background:#e8eee6}
.status.charged{background:#dce9df}
.status.cancelled{
  background:#f2e5e5;
  color:var(--red);
}
.quote-grid{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);
  gap:28px;
}
.details{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}
.detail{
  padding:14px 15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}
.detail-label{
  margin-bottom:5px;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
}
.detail-value{
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  word-break:break-word;
}
.notes{grid-column:1/-1}
.pricing{
  border-left:1px solid var(--line);
  padding-left:28px;
}
.pricing h3{
  margin:0 0 14px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:24px;
  font-weight:400;
}
.price-wrap{
  position:relative;
  margin-bottom:11px;
}
.dollar{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-weight:700;
}
.price-input{
  width:100%;
  padding:14px 14px 14px 31px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
  background:white;
}
.price-input:focus{
  border-color:var(--sage);
  box-shadow:0 0 0 3px rgba(113,134,121,.12);
}
.create-offer,
.copy,
.complete-button,
.reschedule-button,
.cancel-button,
.charge-button,
.locked-button{
  width:100%;
  border:0;
  border-radius:999px;
  padding:13px 16px;
  font-weight:700;
}
.create-offer,
.complete-button,
.charge-button{
  background:var(--green);
  color:white;
  cursor:pointer;
}
.copy{
  margin-top:10px;
  background:#e8eee9;
  color:var(--green);
  cursor:pointer;
}
.reschedule-button{
  margin-top:9px;
  background:#e8eee9;
  color:var(--green);
  cursor:pointer;
}
.cancel-button{
  margin-top:9px;
  background:#f3e8e8;
  color:var(--red);
  cursor:pointer;
}
.locked-button{
  background:#ecebe5;
  color:var(--muted);
}
.locked-note,
.existing-offer{
  margin-top:9px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.offer-result{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
.offer-price{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:28px;
}
.booking-action,
.completed-box,
.cancelled-box{
  margin-top:18px;
  padding:17px;
  border-radius:16px;
  background:#eef2ed;
}
.cancelled-box{background:#f4eaea}
.booking-action-title,
.completed-title,
.cancelled-title{
  color:var(--green);
  font-weight:800;
}
.cancelled-title{color:var(--red)}
.booking-action-text,
.completed-text,
.cancelled-text{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.schedule-display{
  margin-top:14px;
  padding:13px;
  border-radius:12px;
  background:rgba(255,255,255,.72);
}
.schedule-label,
.amount-label{
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  letter-spacing:1.3px;
  text-transform:uppercase;
}
.schedule-value{
  margin-top:5px;
  color:var(--green);
  font-weight:700;
  line-height:1.45;
}
.complete-button{margin-top:13px}
.amount-due{
  margin-top:14px;
  padding:13px;
  border-radius:12px;
  background:rgba(255,255,255,.72);
}
.amount-value{
  margin-top:4px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:28px;
}
.charge-button{margin-top:13px}
.payment-id{
  margin-top:10px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  word-break:break-all;
}
.modal-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(12,30,24,.52);
  backdrop-filter:blur(8px);
}
.modal-card{
  width:100%;
  max-width:470px;
  background:var(--paper);
  border-radius:26px;
  padding:34px;
  box-shadow:0 28px 80px rgba(10,30,23,.28);
  border:1px solid rgba(23,53,43,.08);
  text-align:center;
}
.modal-icon{
  width:58px;
  height:58px;
  margin:0 auto 20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e7eee8;
  color:var(--green);
  font-size:27px;
  font-weight:700;
}
.modal-icon.error{background:#f5e8e8;color:var(--red)}
.modal-icon.warning{background:#f3eee1;color:#755f2e}
.modal-eyebrow{
  color:var(--sage);
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.modal-title{
  margin:0;
  font-family:Georgia,serif;
  font-size:31px;
  font-weight:400;
}
.modal-message{
  margin:13px auto 0;
  max-width:390px;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}
.modal-amount{
  margin:24px 0 0;
  padding:18px;
  border-radius:16px;
  background:#eef2ed;
}
.modal-amount-label{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.modal-amount-value{
  margin-top:4px;
  font-family:Georgia,serif;
  font-size:35px;
}
.modal-reference{
  margin-top:17px;
  padding:14px;
  background:#f4f2ec;
  border-radius:13px;
  text-align:left;
}
.modal-reference-label{
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  margin-bottom:5px;
}
.modal-reference-value{
  font-size:12px;
  line-height:1.5;
  word-break:break-all;
}
.modal-form{
  margin-top:22px;
  text-align:left;
}
.modal-field{margin-top:14px}
.modal-field:first-child{margin-top:0}
.modal-field label{
  display:block;
  margin-bottom:7px;
  color:var(--green);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.1px;
  text-transform:uppercase;
}
.modal-field input{
  width:100%;
  border:1px solid #d8ddd7;
  background:#fff;
  color:var(--ink);
  border-radius:13px;
  padding:13px 14px;
  font:inherit;
  outline:none;
}
.modal-field input:focus{
  border-color:var(--sage);
  box-shadow:0 0 0 3px rgba(105,126,112,.12);
}
.modal-field-error{
  min-height:18px;
  margin-top:8px;
  color:var(--red);
  font-size:12px;
  font-weight:600;
}
.modal-card.schedule-modal{
  max-width:520px;
  text-align:left;
}
.modal-card.schedule-modal .modal-icon{margin-left:0}
.modal-card.schedule-modal .modal-message{margin-left:0}
.modal-card.schedule-modal .modal-actions{margin-top:18px}
.modal-actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}
.modal-button{
  flex:1;
  border:0;
  padding:14px 17px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}
.modal-button.secondary{
  background:#eceae3;
  color:var(--green);
}
.modal-button.primary-modal{
  background:var(--green);
  color:white;
}
.modal-button.danger{
  background:var(--red);
  color:white;
}
.empty,
.loading{
  background:var(--paper);
  border-radius:20px;
  padding:45px;
  text-align:center;
  color:var(--muted);
}

/* FINAL CONSOLIDATED DASHBOARD */
.dashboard-tabs{
  flex-wrap:wrap;
  width:100%;
  border-radius:22px;
}
.view-panel{display:grid;gap:22px}
.overview-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}
.overview-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
}
.overview-card-label{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
}
.overview-card-value{
  margin-top:7px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:31px;
}
.overview-section,
.customer-card,
.payment-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px;
  box-shadow:0 14px 45px rgba(23,53,43,.04);
}
.overview-section h2{
  margin:0 0 16px;
  color:var(--green);
  font-family:Georgia,serif;
  font-size:27px;
  font-weight:400;
}
.compact-job{
  display:grid;
  grid-template-columns:1fr 1.1fr auto;
  gap:16px;
  align-items:center;
  padding:14px 0;
  border-top:1px solid var(--line);
}
.compact-job:first-of-type{border-top:0}
.quick-links{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.quick-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  padding:9px 13px;
  background:#e8eee9;
  color:var(--green);
  text-decoration:none;
  font-size:12px;
  font-weight:800;
}
.customer-grid,
.payment-grid{
  display:grid;
  gap:18px;
}
.customer-head,
.payment-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
}
.customer-title,
.payment-title{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:25px;
}
.customer-meta,
.payment-meta{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
.customer-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:18px;
}
.customer-stat{
  padding:13px;
  border-radius:14px;
  background:#f5f5ef;
}
.customer-stat-label{
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}
.customer-stat-value{
  margin-top:4px;
  color:var(--green);
  font-weight:800;
}
.customer-history{
  margin-top:18px;
  border-top:1px solid var(--line);
}
.customer-history-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font-size:12px;
  align-items:center;
}
.payment-card{
  display:grid;
  grid-template-columns:1.2fr .7fr .9fr;
  gap:20px;
  align-items:center;
}
.payment-amount{
  color:var(--green);
  font-family:Georgia,serif;
  font-size:27px;
}
.payment-actions{
  display:grid;
  gap:8px;
}
.payment-actions button{
  border:0;
  border-radius:999px;
  padding:11px 14px;
  font-weight:800;
  cursor:pointer;
}
.payment-actions .pay-main{background:var(--green);color:#fff}
.payment-actions .pay-soft{background:#e8eee9;color:var(--green)}

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


function money(cents){

  const value =
    Number(cents);

  if(!Number.isFinite(value)){
    return "$0.00";
  }

  return (
    value / 100
  ).toLocaleString(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  );
}


function formatSchedule(value){

  if(!value){
    return "Not scheduled";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "Not scheduled";
  }

  return date.toLocaleString(
    "en-US",
    {
      weekday:"short",
      month:"short",
      day:"numeric",
      year:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );
}


function offerUrl(q){

  if(!q.quote_token){
    return "";
  }

  return (
    `${window.location.origin}` +
    `/offer/?token=` +
    encodeURIComponent(
      q.quote_token
    )
  );
}


function paymentUrl(q){

  if(!q.quote_token){
    return "";
  }

  return (
    `${window.location.origin}` +
    `/payment/?token=` +
    encodeURIComponent(
      q.quote_token

  );
}


function closeModal(result){

  const oldForm =
    modalOverlay.querySelector(

    oldForm.remove();
  }

  if(modalResolver){

    const resolver =
      modalResolver;

    modalResolver = null;

    resolver(result);
  }
}


function prepareModal({
  type="success",
  eyebrow="",
  title="",
  message="",
  amount="",
  referenceLabel="",
  referenceValue=""
}){

  const oldForm =
    modalOverlay.querySelector(
      ".modal-form"
    );

  if(oldForm){
    oldForm.remove();
  }

  const card =
    modalOverlay.querySelector(
      ".modal-card"
    );

  card?.classList.remove(
    "schedule-modal"
  );

  modalIcon.className =
    "modal-icon";

  if(type==="error"){
    modalIcon.classList.add(
      "error"
    );
    modalIcon.textContent="×";
  }
  else if(type==="warning"){
    modalIcon.classList.add(
      "warning"
    );
    modalIcon.textContent="!";
  }
  else if(type==="confirm"){
    modalIcon.classList.add(
      "warning"
    );
    modalIcon.textContent="?";
  }
  else{
    modalIcon.textContent="✓";
  }

  modalEyebrow.textContent =
    eyebrow;

  modalTitle.textContent =
    title;

  modalMessage.textContent =
    message;

  if(amount){
    modalAmountValue.textContent =
      amount;

    modalAmount.classList.remove(
      "hidden"
    );
  }
  else{
    modalAmountValue.textContent="";

    modalAmount.classList.add(
      "hidden"
    );
  }

  if(referenceValue){
    modalReferenceLabel.textContent =
      referenceLabel ||
      "Reference";

    modalReferenceValue.textContent =
      referenceValue;

    modalReference.classList.remove(
      "hidden"
    );
  }
  else{
    modalReferenceLabel.textContent="";
    modalReferenceValue.textContent="";

    modalReference.classList.add(
      "hidden"
    );
  }

  modalActions.innerHTML="";

  document.body.style.overflow =
    "hidden";

  modalOverlay.classList.remove(
    "hidden"
  );
}

function normalizedStatus(q){

  const status =
    String(
      q?.status || ""
    ).toLowerCase();

  if(
    [
      "accepted",
      "card_saved",
      "booked"
    ].includes(status)
  ){
    return "booked";
  }

  return status;
}


function isToday(value){

  if(!value){
    return false;
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return false;
  }

  const now =
    new Date();

  return (
    date.getFullYear() ===
      now.getFullYear() &&
    date.getMonth() ===
      now.getMonth() &&
    date.getDate() ===
      now.getDate()
  );
}


function isThisWeek(value){

  if(!value){
    return false;
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return false;
  }

  const now =
    new Date();

  const start =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const day =
    start.getDay();

  const mondayOffset =
    day === 0
      ? -6
      : 1 - day;

  start.setDate(
    start.getDate() +
    mondayOffset
  );

  const end =
    new Date(start);

  end.setDate(
    start.getDate() + 7
  );

  return (
    date >= start &&
    date < end
  );
}


function isUpcoming(value){

  if(!value){
    return false;
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return false;
  }

  return (
    date.getTime() >
    Date.now()
  );
}


function quoteSearchText(q){

  return [
    q.quote_number,
    q.customer_name,
    q.customer_email,
    q.customer_phone,
    q.service_type,
    q.property_type,
    q.frequency,
    q.zip_code,
    q.notes,
    q.status
  ]
  .filter(Boolean)
  .join(" ")
  .toLowerCase();
}


function sortQuotes(
  quotes,
  sortValue
){

  const result =
    [...quotes];

  if(
    sortValue ===
    "oldest"
  ){

    result.sort(
      (a,b)=>
        new Date(
          a.created_at || 0
        ) -
        new Date(
          b.created_at || 0
        )
    );

  }

  else if(
    sortValue ===
    "appointment"
  ){

    result.sort(
      (a,b)=>{

        const aTime =
          a.scheduled_for
            ? new Date(
                a.scheduled_for
              ).getTime()
            : Number.MAX_SAFE_INTEGER;

        const bTime =
          b.scheduled_for
            ? new Date(
                b.scheduled_for
              ).getTime()
            : Number.MAX_SAFE_INTEGER;

        return aTime-bTime;
      }
    );

  }

  else if(
    sortValue ===
    "name"
  ){

    result.sort(
      (a,b)=>
        String(
          a.customer_name || ""
        ).localeCompare(
          String(
            b.customer_name || ""
          )
        )
    );

  }

  else if(
    sortValue ===
    "price-high"
  ){

    result.sort(
      (a,b)=>
        Number(
          b.quoted_price || 0
        ) -
        Number(
          a.quoted_price || 0
        )
    );

  }

  else if(
    sortValue ===
    "price-low"
  ){

    result.sort(
      (a,b)=>
        Number(
          a.quoted_price || 0
        ) -
        Number(
          b.quoted_price || 0
        )
    );

  }

  else{

    result.sort(
      (a,b)=>
        new Date(
          b.created_at || 0
        ) -
        new Date(
          a.created_at || 0
        )
    );

  }

  return result;
}


function getFilteredQuotes(){

  const search =
    String(
      dashboardSearch.value ||
      ""
    )
    .trim()
    .toLowerCase();

  const selectedStatus =
    statusFilter.value;

  const selectedSchedule =
    scheduleFilter.value;

  let quotes =
    allQuotes.filter(
      q=>{

        if(
          search &&
          !quoteSearchText(q)
            .includes(search)
        ){
          return false;
        }

        if(
          selectedStatus !==
          "all"
        ){

          if(
            normalizedStatus(q) !==
            selectedStatus
          ){
            return false;
          }

        }

        if(
          currentView ===
          "schedule" &&
          selectedSchedule !==
          "all"
        ){

          const status =
            normalizedStatus(q);

          if(
            selectedSchedule ===
            "today" &&
            !isToday(
              q.scheduled_for
            )
          ){
            return false;
          }

          if(
            selectedSchedule ===
            "week" &&
            !isThisWeek(
              q.scheduled_for
            )
          ){
            return false;
          }

          if(
            selectedSchedule ===
            "upcoming" &&
            !(
              status ===
                "booked" &&
              isUpcoming(
                q.scheduled_for
              )
            )
          ){
            return false;
          }

          if(
            selectedSchedule ===
            "needs-scheduling" &&
            !(
              status ===
                "booked" &&
              !q.scheduled_for
            )
          ){
            return false;
          }

          if(
            selectedSchedule ===
            "completed" &&
            status !==
              "completed"
          ){
            return false;
          }

          if(
            selectedSchedule ===
            "paid" &&
            status !==
              "charged"
          ){
            return false;
          }

        }

        return true;
      }
    );

  return sortQuotes(
    quotes,
    sortFilter.value
  );
}

          : "quote records";

  filterSummary.textContent =
    `Showing ${shown} of ${total} ${label}.`;
}


function applyDashboardFilters(){

  const filtered =
    getFilteredQuotes();

  if(
    currentView ===
    "overview"
  ){

    renderOverview(
      filtered
    );

  }

  else if(
    currentView ===
    "quotes"
  ){

    renderQuotes(
      filtered
    );

  }

  else if(
    currentView ===
    "schedule"
  ){

    renderSchedule(
      filtered
    );

  }

  else if(
    currentView ===
    "customers"
  ){

    renderCustomers(
      filtered
    );

  }

  else if(
    currentView ===
    "payments"
  ){

    renderPayments(
      filtered
    );

  }

  setFilterSummary(
    filtered.length
  );
}

function customerKey(q){

  const email =
    String(
      q.customer_email ||
      ""
    )
    .trim()
    .toLowerCase();

  const phone =
    String(
      q.customer_phone ||
      ""
    )
    .replace(/\D/g,"");

  if(email){
    return `email:${email}`;
  }

  if(phone){
    return `phone:${phone}`;
  }

  return (
    "name:" +
    String(
      q.customer_name ||
      q.id ||
      crypto.randomUUID()
    )
    .trim()
    .toLowerCase()
  );
}


function buildCustomers(
  quotes
){

  const groups =
    new Map();

  for(
    const quote of quotes
  ){

    const key =
      customerKey(
        quote
      );

    if(
      !groups.has(key)
    ){

      groups.set(
        key,
        {
          key,
          name:
            quote.customer_name ||
            "Customer",
          email:
            quote.customer_email ||
            "",
          phone:
            quote.customer_phone ||
            "",
          zip:
            quote.zip_code ||
            "",
          jobs:[]
        }
      );

    }

    const customer =
      groups.get(key);

    customer.jobs.push(
      quote
    );

    if(
      !customer.email &&
      quote.customer_email
    ){
      customer.email =
        quote.customer_email;
    }

    if(
      !customer.phone &&
      quote.customer_phone
    ){
      customer.phone =
        quote.customer_phone;
    }

    if(
      !customer.zip &&
      quote.zip_code
    ){
      customer.zip =
        quote.zip_code;
    }
  }

  return Array.from(
    groups.values()
  )
  .map(
    customer=>{

      const jobs =
        customer.jobs;

      const paid =
        jobs.filter(
          q=>
            q.status ===
            "charged"
        );

      const completed =
        jobs.filter(
          q=>
            [
              "completed",
              "charged"
            ].includes(
              q.status
            )
        );

      const cancelled =
        jobs.filter(
          q=>
            q.status ===
            "cancelled"
        );

      const outstanding =
        jobs.filter(
          q=>
            q.status ===
            "completed"
        );

      const totalPaid =
        paid.reduce(
          (sum,q)=>
            sum +
            Number(
              q.quoted_price ||
              0
            ),
          0
        );

      const outstandingAmount =
        outstanding.reduce(
          (sum,q)=>
            sum +
            Number(
              q.quoted_price ||
              0
            ),
          0
        );

      const completedDates =
        completed
          .map(
            q=>
              q.completed_at ||
              q.scheduled_for ||
              q.charged_at
          )
          .filter(Boolean)
          .map(
            value=>
              new Date(value)
          )
          .filter(
            date=>
              !Number.isNaN(
                date.getTime()
              )
          )
          .sort(
            (a,b)=>b-a
          );

      const upcomingDates =
        jobs
          .filter(
            q=>
              normalizedStatus(q) ===
                "booked" &&
              q.scheduled_for &&
              isUpcoming(
                q.scheduled_for
              )
          )
          .map(
            q=>
              new Date(
                q.scheduled_for
              )
          )
          .sort(
            (a,b)=>a-b
          );

      return {
        ...customer,
        totalBookings:
          jobs.length,
        completedCount:
          completed.length,
        cancelledCount:
          cancelled.length,
        totalPaid,
        outstandingAmount,
        lastCleaning:
          completedDates[0] ||
          null,
        nextCleaning:
          upcomingDates[0] ||
          null
      };
    }
  )
  .sort(
    (a,b)=>
      String(
        a.name
      ).localeCompare(
        String(
          b.name
        )
      )
  );
}

async function copyPaymentLink(
  quoteId,
  url
){

  if(!url){
    return;
  }

  try{

    await navigator
      .clipboard
      .writeText(url);

    await showMessageModal({
      type:"success",
      eyebrow:"Payment recovery",
      title:"Payment link copied",
      message:
        "The secure recovery-payment link is ready to send to the customer."
    });

  }
  catch{

    await showMessageModal({
      type:"warning",
      eyebrow:"Payment recovery",
      title:"Copy this payment link",
      message:url,
      referenceLabel:
        "Secure Payment Link",
      referenceValue:url
    });

  }
}

function renderSchedule(
  quotes
){

  const activeStatuses = [
    "accepted",
    "card_saved",
    "booked"
  ];

  const upcoming =
    quotes
      .filter(
        q=>
          activeStatuses.includes(
            q.status
          ) &&
          q.scheduled_for
      )
      .sort(
        (a,b)=>
          new Date(
            a.scheduled_for
          ) -
          new Date(
            b.scheduled_for
          )
      );

  const needsScheduling =
    quotes.filter(
      q=>
        activeStatuses.includes(
          q.status
        ) &&
        !q.scheduled_for
    );

  const completed =
    quotes
      .filter(
        q=>
          q.status ===
          "completed"
      )
      .sort(
        (a,b)=>
          new Date(
            b.completed_at ||
            b.created_at
          ) -
          new Date(
            a.completed_at ||
            a.created_at
          )
      );

  const paid =
    quotes
      .filter(
        q=>
          q.status ===
          "charged"
      )
      .sort(
        (a,b)=>
          new Date(
            b.charged_at ||
            b.created_at
          ) -
          new Date(
            a.charged_at ||
            a.created_at
          )
      );

  const cancelled =
    quotes
      .filter(
        q=>
          q.status ===
          "cancelled"
      )
      .sort(
        (a,b)=>
          new Date(
            b.created_at ||
            0
          ) -
          new Date(
            a.created_at ||
            0
          )
      );

  scheduleBoard.innerHTML =
    scheduleSectionHtml(
      "Upcoming Cleanings",
      upcoming,
      "upcoming",
      "No upcoming cleanings are scheduled."
    ) +

    scheduleSectionHtml(
      "Needs Scheduling",
      needsScheduling,
      "needs-scheduling",
      "No secured bookings are waiting for a schedule."
    ) +

    scheduleSectionHtml(
      "Completed · Awaiting Payment",
      completed,
      "completed",
      "No completed cleanings are waiting for payment."
    ) +

    scheduleSectionHtml(
      "Paid Jobs",
      paid,
      "paid",
      "No paid jobs yet."
    ) +

    scheduleSectionHtml(
      "Cancelled Jobs",
      cancelled,
      "cancelled",
      "No cancelled jobs."
    );
}

  async function loadQuotes(){

  if(!adminPassword){
    return;
  }

  refreshButton.disabled =
    true;

  refreshButton.textContent =
    "Refreshing...";

  try{

    const response =
      await fetch(
        "/.netlify/functions/admin-quotes",
        {
          method:"GET",

          headers:{
            "x-admin-password":
              adminPassword
          },

          cache:"no-store"
        }
      );

    const data =
      await response
        .json()
        .catch(
          ()=>null
        );

    if(
      !response.ok ||
      !data ||
      !data.ok
    ){

      if(
        response.status ===
        401
      ){

        throw new Error(
          "Incorrect admin password."
        );

      }

      throw new Error(
        data?.error ||
        "Could not load quotes."
      );

    }

    allQuotes =
      Array.isArray(
        data.quotes
      )
        ? data.quotes
        : [];

    setStats(
      allQuotes
    );

    setDashboardView(
      currentView
    );

  }
  catch(error){

    quotesContainer.innerHTML=`
      <div class="empty">
        ${escapeHtml(
          error.message ||
          "Could not load quotes."
        )}
      </div>
    `;

    throw error;

  }
  finally{

    refreshButton.disabled =
      false;

    refreshButton.textContent =
      "Refresh";

  }
}

async function createOffer(
  quoteId
){

  const input =
    document.getElementById(
      `price-${quoteId}`
    );

  const button =
    document.getElementById(
      `offer-${quoteId}`
    );

  const result =
    document.getElementById(
      `result-${quoteId}`
    );

  if(
    !input ||
    !button ||
    !result
  ){
    return;
  }

  const dollars =
    Number(
      input.value
    );

  if(
    !Number.isFinite(
      dollars
    ) ||
    dollars <= 0
  ){

    await showMessageModal({
      type:"error",
      eyebrow:"Quote price",
      title:"Enter a valid price",
      message:
        "Enter a valid cleaning price before creating the customer offer."
    });

    input.focus();

    return;
  }

  button.disabled =
    true;

  button.textContent =
    "Creating Offer...";

  try{

    /*
      create-offer expects the price in
      dollars as body.price.

      The server converts it to cents.
    */

    const response =
      await fetch(
        "/.netlify/functions/create-offer",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-admin-password":
              adminPassword
          },

          body:
            JSON.stringify({
              quote_id:
                quoteId,

              price:
                dollars
            })
        }
      );

    const data =
      await response
        .json()
        .catch(
          ()=>null
        );

    if(
      !response.ok ||
      !data ||
      !data.ok
    ){

      throw new Error(
        data?.error ||
        "Could not create offer."
      );

    }

    result.className =
      "offer-result";

    result.innerHTML=`
      <div class="offer-price">
        ${money(
          data.quoted_price
        )}
      </div>

      <button
        class="copy"
        id="copy-${quoteId}"
      >
        Copy Customer Link
      </button>

      <div class="existing-offer">
        Offer created successfully.
      </div>
    `;

    document
      .getElementById(
        `copy-${quoteId}`
      )
      .addEventListener(
        "click",
        ()=>{
          copyOffer(
            quoteId,
            data.offer_url
          );
        }
      );

    button.textContent =
      "Update Customer Offer";

    await loadQuotes();

  }
  catch(error){

    await showMessageModal({
      type:"error",
      eyebrow:"Offer error",
      title:"Could not create offer",
      message:
        error.message ||
        "Could not create offer."
    });

  }
  finally{

    button.disabled =
      false;

    if(
      button.textContent ===
      "Creating Offer..."
    ){

      button.textContent =
        "Create Customer Offer";

    }

  }
}


async function copyOffer(
  quoteId,
  url
){

  try{

    await navigator
      .clipboard
      .writeText(
        url
      );

    const button =
      document.getElementById(
        `copy-${quoteId}`
      );

    if(button){

      const original =
        button.textContent;

      button.textContent =
        "Copied ✓";

      setTimeout(
        ()=>{
          button.textContent =
            original;
        },
        1500
      );

    }

  }
  catch{

    await showMessageModal({
      type:"warning",
      eyebrow:"Customer link",
      title:"Copy this link",
      message:url,
      referenceLabel:
        "Customer Offer Link",
      referenceValue:
        url,
      buttonText:"Done"
    });

  }
}


async function rescheduleBooking(
  quoteId
){

  const button =
    document.getElementById(
      `reschedule-${quoteId}`
    );

  if(!button){
    return;
  }

  const scheduledDate =
    await showScheduleModal();

  if(!scheduledDate){
    return;
  }

  const displayDate =
    scheduledDate
      .toLocaleString(
        "en-US",
        {
          weekday:"long",
          month:"long",
          day:"numeric",
          year:"numeric",
          hour:"numeric",
          minute:"2-digit"
        }
      );

  const confirmed =
    await showConfirmModal({
      eyebrow:
        "Booking schedule",

      title:
        "Update this booking?",

async function chargeCustomer(
  quoteId,
  displayedAmount,
  recoveryLink
){

  const button =
    document.getElementById(
      `charge-${quoteId}`
    );

  if(!button){
    return;
  }

  const formattedAmount =
    money(
      displayedAmount
    );

  const confirmed =
    await showConfirmModal({
      eyebrow:
        "Payment authorization",

      title:
        "Charge customer?",

      message:
        "The cleaning is marked complete. " +
        "This will charge the customer's saved payment method.",

      amount:
        formattedAmount,

      confirmText:
        `Charge ${formattedAmount}`,

      cancelText:
        "Cancel"
    });

  if(!confirmed){
    return;
  }

  const originalText =
    button.textContent;

  button.disabled =
    true;

  button.textContent =
    "Processing Payment...";

  try{

    const response =
      await fetch(
        "/.netlify/functions/charge-customer",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-admin-password":
              adminPassword
          },

          body:
            JSON.stringify({
              quote_id:
                quoteId
            })
        }
      );

    const data =
      await response
        .json()
        .catch(
          ()=>null
        );

    if(
      !response.ok ||
      !data ||
      !data.ok
    ){

      /*
        Stripe charged successfully but the
        database update failed.

        Never retry this charge automatically.
      */

      if(
        data &&
        data.payment_succeeded
      ){

        await showMessageModal({
          type:"warning",
          eyebrow:
            "Payment needs review",
          title:
            "Do not charge again",
          message:
            "Stripe successfully charged the customer, " +
            "but the booking record could not be updated. " +
            "Do NOT retry this payment.",
          referenceLabel:
            "Stripe Payment ID",
          referenceValue:
            data.payment_intent_id ||
            "Unknown",
          buttonText:
            "I Understand"
        });

        button.disabled =
          true;

        button.textContent =
          "Payment Needs Review";

        return;
      }

      /*
        Saved card failed.

        The existing recovery-payment flow
        can be sent to the customer.
      */

      if(
        data &&
        data.customer_action_required ===
          true &&
        recoveryLink
      ){

        prepareModal({
          type:"warning",
          eyebrow:
            "Payment failed",
          title:
            "Customer action required",
          message:
            data.customer_message ||
            "The saved payment method could not be charged. Send the customer the secure payment link so they can use another payment method.",
          amount:
            formattedAmount,
          referenceLabel:
            "Secure Payment Link",
          referenceValue:
            recoveryLink
        });

        const closeButton =
          document.createElement(
            "button"
          );

        closeButton.className =
          "modal-button secondary";

        closeButton.textContent =
          "Close";

        closeButton.addEventListener(
          "click",
          ()=>closeModal(true)
        );

        const copyButton =
          document.createElement(
            "button"
          );

        copyButton.className =
          "modal-button primary-modal";

        copyButton.textContent =
          "Copy Payment Link";

        copyButton.addEventListener(
          "click",
          async ()=>{

            try{

              await navigator
                .clipboard
                .writeText(
                  recoveryLink
                );

              copyButton.textContent =
                "Copied ✓";

              setTimeout(
                ()=>{
                  copyButton.textContent =
                    "Copy Payment Link";
                },
                1500
              );

            }
            catch{

              modalReferenceValue
                .textContent =
                  recoveryLink;

            }

          }
        );

        modalActions.appendChild(
          closeButton
        );

        modalActions.appendChild(
          copyButton
        );

        button.disabled =
          false;

        button.textContent =
          originalText;

        return;
      }

      throw new Error(
        data?.detail ||
        data?.error ||
        "The customer could not be charged."
      );

    }

    await loadQuotes();

    await showMessageModal({
      type:"success",
      eyebrow:
        "Payment completed",
      title:
        "Customer charged successfully",
      message:
        "The payment was processed successfully and this booking is now marked as paid.",
      amount:
        data.amount_formatted ||
        formattedAmount,
      referenceLabel:
        "Stripe Payment ID",
      referenceValue:
        data.payment_intent_id ||
        "",
      buttonText:
        "Done"
    });

  }
  catch(error){

    await showMessageModal({
      type:"error",
      eyebrow:
        "Payment error",
      title:
        "Payment could not be completed",
      message:
        error.message ||
        "The customer could not be charged."
    });

    button.disabled =
      false;

    button.textContent =
      originalText;

  }
}
