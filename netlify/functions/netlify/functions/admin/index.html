<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="robots" content="noindex,nofollow">

  <title>
    Quote Dashboard | The Fresh Standard Co.
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --green: #17352b;
      --sage: #829381;
      --cream: #f4f1e9;
      --paper: #fffdf8;
      --line: #dedfd8;
      --muted: #6e7772;
      --red: #9d4141;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--green);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: var(--paper);
      padding: 45px;
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(23,53,43,.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand-main {
      font-family: Georgia, serif;
      font-size: 27px;
      letter-spacing: 2px;
    }

    .brand-sub {
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--sage);
    }

    h1,
    h2,
    h3 {
      font-family: Georgia, serif;
      font-weight: 400;
    }

    .login-card h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-description {
      text-align: center;
      color: var(--muted);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 15px 17px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: white;
      color: var(--green);
      outline: none;
    }

    input:focus {
      border-color: var(--sage);
    }

    .primary {
      width: 100%;
      border: 0;
      background: var(--green);
      color: white;
      padding: 16px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary:disabled {
      opacity: .55;
      cursor: wait;
    }

    .login-button {
      margin-top: 14px;
    }

    .login-error {
      color: var(--red);
      text-align: center;
      font-size: 13px;
      margin-top: 15px;
    }

    /* DASHBOARD */

    header {
      background: var(--green);
      color: white;
      padding: 25px 32px;
    }

    .header-inner {
      max-width: 1250px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
    }

    .header-brand {
      font-family: Georgia, serif;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .header-label {
      margin-top: 5px;
      color: #cbd6cf;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .logout {
      border: 1px solid rgba(255,255,255,.35);
      color: white;
      background: transparent;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
    }

    main {
      max-width: 1250px;
      margin: auto;
      padding: 45px 25px 80px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 25px;
      align-items: flex-end;
      margin-bottom: 30px;
    }

    .top h1 {
      font-size: 40px;
      margin: 0;
    }

    .top p {
      color: var(--muted);
      margin: 8px 0 0;
    }

    .refresh {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--green);
      padding: 11px 18px;
      border-radius: 999px;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat {
      background: var(--paper);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid rgba(23,53,43,.05);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-family: Georgia, serif;
      font-size: 31px;
      margin-top: 7px;
    }

    .quotes {
      display: grid;
      gap: 18px;
    }

    .quote-card {
      background: var(--paper);
      border-radius: 22px;
      padding: 26px;
      border: 1px solid rgba(23,53,43,.06);
      box-shadow:
        0 10px 35px rgba(23,53,43,.05);
    }

    .quote-head {
      display: flex;
      justify-content: space-between;
      gap: 25px;
      margin-bottom: 22px;
    }

    .quote-number {
      color: var(--sage);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .customer {
      font-family: Georgia, serif;
      font-size: 26px;
      margin-top: 5px;
    }

    .status-badge {
      align-self: flex-start;
      padding: 8px 12px;
      border-radius: 999px;
      background: #edf1ec;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .quote-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 30px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px 25px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .detail-value {
      line-height: 1.5;
      word-break: break-word;
    }

    .notes {
      grid-column: 1 / -1;
      background: #f6f4ee;
      padding: 14px;
      border-radius: 12px;
    }

    .pricing {
      border-left: 1px solid var(--line);
      padding-left: 30px;
    }

    .pricing h3 {
      margin: 0 0 15px;
      font-size: 22px;
    }

    .price-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .dollar {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 700;
    }

    .price-input {
      padding-left: 34px;
      font-size: 18px;
      font-weight: 700;
    }

    .offer-result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #eef2ed;
    }

    .offer-price {
      font-family: Georgia, serif;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .copy {
      width: 100%;
      border: 1px solid var(--green);
      color: var(--green);
      background: transparent;
      padding: 12px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
    }

    .existing-offer {
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.5;
    }

    .empty,
    .loading {
      background: var(--paper);
      border-radius: 20px;
      padding: 45px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 850px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .quote-grid {
        grid-template-columns: 1fr;
      }

      .pricing {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding-left: 0;
        padding-top: 25px;
      }
    }

    @media (max-width: 550px) {
      .login-card {
        padding: 35px 22px;
      }

      header {
        padding: 20px;
      }

      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .top h1 {
        font-size: 34px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .quote-head {
        flex-direction: column;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .notes {
        grid-column: auto;
      }

      .quote-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <section id="loginPage" class="login-page">

    <div class="login-card">

      <div class="brand">
        <div class="brand-main">
          THE FRESH
        </div>

        <div class="brand-sub">
          Standard Co.
        </div>
      </div>

      <h1>Owner Dashboard</h1>

      <div class="login-description">
        Sign in to review incoming cleaning requests
        and create customer offers.
      </div>

      <input
        id="password"
        type="password"
        placeholder="Admin password"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        class="primary login-button"
      >
        Sign In
      </button>

      <div
        id="loginError"
        class="login-error hidden"
      ></div>

    </div>

  </section>


  <!-- DASHBOARD -->

  <section id="dashboard" class="hidden">

    <header>
      <div class="header-inner">

        <div>
          <div class="header-brand">
            THE FRESH STANDARD CO.
          </div>

          <div class="header-label">
            Owner Dashboard
          </div>
        </div>

        <button
          id="logoutButton"
          class="logout"
        >
          Sign Out
        </button>

      </div>
    </header>

    <main>

      <div class="top">

        <div>
          <h1>Quote Requests</h1>

          <p>
            Review leads, set pricing and create
            customer booking offers.
          </p>
        </div>

        <button
          id="refreshButton"
          class="refresh"
        >
          Refresh
        </button>

      </div>

      <div class="stats">

        <div class="stat">
          <div class="stat-label">
            Total
          </div>

          <div
            id="totalCount"
            class="stat-value"
          >
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            New
          </div>

          <div
            id="newCount"
            class="stat-value"
          >
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            Quoted
          </div>

          <div
            id="quotedCount"
            class="stat-value"
          >
            0
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            Booked
          </div>

          <div
            id="bookedCount"
            class="stat-value"
          >
            0
          </div>
        </div>

      </div>

      <div id="quotes" class="quotes">

        <div class="loading">
          Loading quotes...
        </div>

      </div>

    </main>

  </section>


<script>
  let adminPassword = "";

  const loginPage =
    document.getElementById("loginPage");

  const dashboard =
    document.getElementById("dashboard");

  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const loginError =
    document.getElementById("loginError");

  const quotesContainer =
    document.getElementById("quotes");


  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function money(cents) {
    if (!cents) return "";

    return (Number(cents) / 100)
      .toLocaleString("en-US", {
        style: "currency",
        currency: "USD"
      });
  }


  function offerUrl(q) {
    if (!q.quote_token) return "";

    return (
      "https://thefreshstandardco.com/offer/?token=" +
      encodeURIComponent(q.quote_token)
    );
  }


  function setStats(quotes) {
    document.getElementById("totalCount")
      .textContent = quotes.length;

    document.getElementById("newCount")
      .textContent =
      quotes.filter(q => q.status === "new").length;

    document.getElementById("quotedCount")
      .textContent =
      quotes.filter(q => q.status === "quoted").length;

    document.getElementById("bookedCount")
      .textContent =
      quotes.filter(q =>
        [
          "accepted",
          "card_saved",
          "booked",
          "completed",
          "charged"
        ].includes(q.status)
      ).length;
  }


  function renderQuotes(quotes) {
    setStats(quotes);

    if (!quotes.length) {
      quotesContainer.innerHTML = `
        <div class="empty">
          No quote requests yet.
        </div>
      `;

      return;
    }

    quotesContainer.innerHTML =
      quotes.map(q => {

        const propertyDetails = [
          q.bedrooms !== null &&
          q.bedrooms !== undefined
            ? `${q.bedrooms} bed`
            : "",

          q.bathrooms !== null &&
          q.bathrooms !== undefined
            ? `${q.bathrooms} bath`
            : "",

          q.square_feet
            ? `${Number(q.square_feet)
                .toLocaleString()} sq ft`
            : ""
        ]
        .filter(Boolean)
        .join(" · ");


        const existingOffer =
          q.quoted_price && q.quote_token
            ? `
              <div
                class="offer-result"
                id="result-${q.id}"
              >

                <div class="offer-price">
                  ${money(q.quoted_price)}
                </div>

                <button
                  class="copy"
                  onclick="copyOffer(
                    '${q.id}',
                    '${offerUrl(q)}'
                  )"
                >
                  Copy Customer Link
                </button>

                <div class="existing-offer">
                  Offer already created.
                  You can update the price below
                  and generate it again.
                </div>

              </div>
            `
            : `
              <div
                id="result-${q.id}"
              ></div>
            `;


        return `
          <article class="quote-card">

            <div class="quote-head">

              <div>
                <div class="quote-number">
                  ${escapeHtml(q.quote_number)}
                </div>

                <div class="customer">
                  ${escapeHtml(q.customer_name)}
                </div>
              </div>

              <div class="status-badge">
                ${escapeHtml(q.status || "new")}
              </div>

            </div>


            <div class="quote-grid">

              <div class="details">

                <div>
                  <div class="detail-label">
                    Service
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(q.service_type)}
                  </div>
                </div>


                <div>
                  <div class="detail-label">
                    Property
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(q.property_type || "—")}
                  </div>
                </div>


                <div>
                  <div class="detail-label">
                    Frequency
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(q.frequency || "—")}
                  </div>
                </div>


                <div>
                  <div class="detail-label">
                    Property Details
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(propertyDetails || "—")}
                  </div>
                </div>


                <div>
                  <div class="detail-label">
                    ZIP
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(q.zip_code || "—")}
                  </div>
                </div>


                <div>
                  <div class="detail-label">
                    Phone
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(q.customer_phone || "—")}
                  </div>
                </div>


                <div>
                  <div class="detail-label">
                    Email
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(q.customer_email || "—")}
                  </div>
                </div>


                ${
                  q.notes
                    ? `
                      <div class="notes">
                        <div class="detail-label">
                          Customer Notes
                        </div>

                        <div class="detail-value">
                          ${escapeHtml(q.notes)}
                        </div>
                      </div>
                    `
                    : ""
                }

              </div>


              <div class="pricing">

                <h3>Set Quote Price</h3>

                <div class="price-wrap">
                  <span class="dollar">$</span>

                  <input
                    id="price-${q.id}"
                    class="price-input"
                    type="number"
                    min="1"
                    step="0.01"
                    placeholder="150.00"
                    value="${
                      q.quoted_price
                        ? Number(q.quoted_price) / 100
                        : ""
                    }"
                  >
                </div>

                <button
                  class="primary"
                  id="create-${q.id}"
                  onclick="createOffer('${q.id}')"
                >
                  ${
                    q.quoted_price
                      ? "Update Customer Offer"
                      : "Create Customer Offer"
                  }
                </button>

                ${existingOffer}

              </div>

            </div>

          </article>
        `;
      }).join("");
  }


  async function login() {
    const password = passwordInput.value;

    if (!password) return;

    loginButton.disabled = true;
    loginButton.textContent = "Signing In...";

    loginError.classList.add("hidden");

    try {
      const response = await fetch(
        "/.netlify/functions/admin-auth",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            password
          })
        }
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error || "Sign in failed."
        );
      }

      adminPassword = password;

      passwordInput.value = "";

      loginPage.classList.add("hidden");
      dashboard.classList.remove("hidden");

      await loadQuotes();

    } catch (error) {
      loginError.textContent =
        error.message || "Sign in failed.";

      loginError.classList.remove("hidden");

    } finally {
      loginButton.disabled = false;
      loginButton.textContent = "Sign In";
    }
  }


  async function loadQuotes() {
    quotesContainer.innerHTML = `
      <div class="loading">
        Loading quotes...
      </div>
    `;

    try {
      const response = await fetch(
        "/.netlify/functions/admin-quotes",
        {
          headers: {
            "x-admin-password": adminPassword
          }
        }
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error || "Could not load quotes."
        );
      }

      renderQuotes(data.quotes || []);

    } catch (error) {
      quotesContainer.innerHTML = `
        <div class="empty">
          ${escapeHtml(
            error.message ||
            "Could not load quotes."
          )}
        </div>
      `;
    }
  }


  async function createOffer(quoteId) {
    const input =
      document.getElementById(
        `price-${quoteId}`
      );

    const button =
      document.getElementById(
        `create-${quoteId}`
      );

    const result =
      document.getElementById(
        `result-${quoteId}`
      );

    const price = Number(input.value);

    if (!Number.isFinite(price) || price <= 0) {
      alert("Enter a valid quote price.");
      return;
    }

    button.disabled = true;
    button.textContent = "Creating Offer...";

    try {
      const response = await fetch(
        "/.netlify/functions/set-quote-price",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "x-admin-password": adminPassword
          },

          body: JSON.stringify({
            quote_id: quoteId,
            price
          })
        }
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error ||
          "Could not create offer."
        );
      }

      result.className = "offer-result";

      result.innerHTML = `
        <div class="offer-price">
          ${money(data.quoted_price)}
        </div>

        <button
          class="copy"
          id="copy-${quoteId}"
        >
          Copy Customer Link
        </button>

        <div class="existing-offer">
          Offer created successfully.
        </div>
      `;

      document
        .getElementById(`copy-${quoteId}`)
        .addEventListener("click", () => {
          copyOffer(
            quoteId,
            data.offer_url
          );
        });

      button.textContent =
        "Update Customer Offer";

    } catch (error) {
      alert(
        error.message ||
        "Could not create offer."
      );

    } finally {
      button.disabled = false;

      if (
        button.textContent ===
        "Creating Offer..."
      ) {
        button.textContent =
          "Create Customer Offer";
      }
    }
  }


  async function copyOffer(
    quoteId,
    url
  ) {
    try {
      await navigator.clipboard.writeText(url);

      const button =
        document.getElementById(
          `copy-${quoteId}`
        );

      if (button) {
        const original =
          button.textContent;

        button.textContent = "Copied ✓";

        setTimeout(() => {
          button.textContent = original;
        }, 1500);
      }

    } catch {
      window.prompt(
        "Copy this customer link:",
        url
      );
    }
  }


  function logout() {
    adminPassword = "";

    dashboard.classList.add("hidden");
    loginPage.classList.remove("hidden");

    quotesContainer.innerHTML = "";
  }


  loginButton.addEventListener(
    "click",
    login
  );


  passwordInput.addEventListener(
    "keydown",
    event => {
      if (event.key === "Enter") {
        login();
      }
    }
  );


  document
    .getElementById("refreshButton")
    .addEventListener(
      "click",
      loadQuotes
    );


  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      logout
    );

</script>

</body>
</html>
